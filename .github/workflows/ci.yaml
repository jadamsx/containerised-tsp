name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPOSITORY: ghcr.io/jadamsx/containerised-tsp

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/web-app

      - name: Lint web app
        run: npm run lint
        working-directory: frontend/web-app

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Brute Force
            path: backend/multi-container/brute-force
            port: 3030
            worker: true
          - name: Three-Opt
            path: backend/multi-container/three-opt
            port: 3040
            worker: true
          - name: Dynamic Programming
            path: backend/single-container/dynamic-programming
            port: 3020
            worker: false
          - name: Cheapest Insertion
            path: backend/single-container/cheapest-insertion
            port: 3010
            worker: false
          - name: Nearest Neighbour
            path: backend/single-container/nearest-neighbour
            port: 3000
            worker: false

    name: Test ${{ matrix.name }}

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Start service
        run: |
          node src/server.js &
          if [ "${{ matrix.worker }}" = "true" ]; then
            node src/worker.js &
          fi
          timeout 30 bash -c 'until curl -sf localhost:${{ matrix.port }}/health >/dev/null; do sleep 1; done'

      - name: Run API tests
        run: npm run test:api

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: brute-force
            path: backend/multi-container/brute-force
          - name: three-opt
            path: backend/multi-container/three-opt
          - name: dynamic-programming
            path: backend/single-container/dynamic-programming
          - name: cheapest-insertion
            path: backend/single-container/cheapest-insertion
          - name: nearest-neighbour
            path: backend/single-container/nearest-neighbour
          - name: web-app
            path: frontend/web-app

    name: Build ${{ matrix.name }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short sha
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPOSITORY }}/${{ matrix.name }}:main
            ${{ env.REPOSITORY }}/${{ matrix.name }}:${{ steps.sha.outputs.SHORT_SHA }}
          labels: org.opencontainers.image.source=https://github.com/jadamsx/containerised-tsp
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          load: true
          tags: ${{ env.REPOSITORY }}/${{ matrix.name }}:local
          labels: org.opencontainers.image.source=https://github.com/jadamsx/containerised-tsp
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Export image
        if: github.event_name == 'pull_request'
        run: docker save ${{ env.REPOSITORY }}/${{ matrix.name }}:local -o ${{ matrix.name }}.tar

      - name: Upload image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ matrix.name }}.tar
          retention-days: 1

  k3d:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint chart
        run: helm lint deploy/helm/tsp

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true

      - name: Load images
        run: |
          for image in *.tar; do
            docker load -i "$image"
          done

      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/v5.8.3/install.sh | TAG=v5.8.3 bash

      - name: Deploy to k3d
        run: scripts/k3d-up.sh
        env:
          SKIP_BUILD: 1

      - name: Wait for rollout
        run: |
          for deployment in $(kubectl --context k3d-tsp get deployments -o name); do
            kubectl --context k3d-tsp rollout status "$deployment" --timeout=120s
          done

      - name: Solve through the web app
        run: scripts/k3d-smoke.sh

      - name: Show pods and logs on failure
        if: failure()
        run: |
          kubectl --context k3d-tsp get pods
          for pod in $(kubectl --context k3d-tsp get pods -o name); do
            echo "::group::$pod"
            kubectl --context k3d-tsp logs "$pod" --tail=100
            echo "::endgroup::"
          done
