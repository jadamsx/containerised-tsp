name: Release

on:
  push:
    tags: [ 'v*' ]

env:
  REPOSITORY: ghcr.io/jadamsx/containerised-tsp

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: brute-force
            path: backend/multi-container/brute-force
          - name: three-opt
            path: backend/multi-container/three-opt
          - name: dynamic-programming
            path: backend/single-container/dynamic-programming
          - name: cheapest-insertion
            path: backend/single-container/cheapest-insertion
          - name: nearest-neighbour
            path: backend/single-container/nearest-neighbour
          - name: web-app
            path: frontend/web-app

    name: Release ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.BUILD_RELEASE }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPOSITORY }}/${{ matrix.name }}:${{ github.ref_name }}
            ${{ env.REPOSITORY }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
