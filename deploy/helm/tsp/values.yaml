image:
  repository: ghcr.io/jadamsx/containerised-tsp
  tag: ""
  pullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 96Mi

singles:
  nearest-neighbour:
    port: 3000
  cheapest-insertion:
    port: 3010
  dynamic-programming:
    port: 3020

masters:
  brute-force:
    port: 3030
    queuePort: 3031
    workers: 2
  three-opt:
    port: 3040
    queuePort: 3041
    workers: 2

webApp:
  port: 8080

ingress:
  enabled: false
  className: ""
  host: tsp.local
