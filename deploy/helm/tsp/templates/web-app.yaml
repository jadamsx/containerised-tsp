apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web-app
    spec:
      containers:
        - name: web-app
          image: {{ include "tsp.image" (dict "root" . "name" "web-app") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.webApp.port }}
          env:
            - name: NEAREST_NEIGHBOUR_URL
              value: http://{{ .Release.Name }}-nearest-neighbour:{{ index .Values.singles "nearest-neighbour" "port" }}/solve
            - name: CHEAPEST_INSERTION_URL
              value: http://{{ .Release.Name }}-cheapest-insertion:{{ index .Values.singles "cheapest-insertion" "port" }}/solve
            - name: DYNAMIC_PROGRAMMING_URL
              value: http://{{ .Release.Name }}-dynamic-programming:{{ index .Values.singles "dynamic-programming" "port" }}/solve
            - name: BRUTE_FORCE_URL
              value: http://{{ .Release.Name }}-brute-force-master:{{ index .Values.masters "brute-force" "port" }}
            - name: THREE_OPT_URL
              value: http://{{ .Release.Name }}-three-opt-master:{{ index .Values.masters "three-opt" "port" }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.webApp.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.webApp.port }}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web-app
spec:
  selector:
    app: {{ .Release.Name }}-web-app
  ports:
    - port: {{ .Values.webApp.port }}
