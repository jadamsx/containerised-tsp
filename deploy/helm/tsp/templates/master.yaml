{{- range $name, $svc := .Values.masters }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ $name }}-master
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $name }}-master
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: master
          image: {{ include "tsp.image" (dict "root" $ "name" $name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ $svc.port }}
            - name: queue
              containerPort: {{ $svc.queuePort }}
          readinessProbe:
            httpGet:
              path: /health
              port: api
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-master
spec:
  selector:
    app: {{ $.Release.Name }}-{{ $name }}-master
  ports:
    - name: api
      port: {{ $svc.port }}
    - name: queue
      port: {{ $svc.queuePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-worker
spec:
  replicas: {{ $svc.workers }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ $name }}-worker
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $name }}-worker
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "tsp.image" (dict "root" $ "name" $name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: worker
            - name: {{ $name | upper | replace "-" "_" }}_MASTER_URL
              value: http://{{ $.Release.Name }}-{{ $name }}-master:{{ $svc.queuePort }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}
